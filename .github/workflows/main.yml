name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Generate project
        run: |
          git clone --depth 1 https://github.com/StandoByte/RotP-Addon-example.git tpl
          set -e
          BASE=$PWD
          SRC=$BASE/tpl
          OUT=$BASE/out
          rm -rf $OUT && mkdir -p $OUT && cd $SRC
          cp -r gradle gradlew gradlew.bat .gitignore .gitattributes LICENSE gradle.properties $OUT/
          sed -e "s/archivesBaseName = 'RotP-AddonExample'/archivesBaseName = 'RotP-TheWorldUltimate'/" -e "s/com.yourname.modid/com.rotpaddon.twu/" build.gradle > $OUT/build.gradle
          P=$OUT/src/main/java/com/rotpaddon/twu
          R=$OUT/src/main/resources
          mkdir -p $P/init $P/action $P/entity $P/client/render $R/META-INF
          mkdir -p $R/assets/rotp_twu/lang $R/assets/rotp_twu/textures/action $R/assets/rotp_twu/textures/entity/stand $R/assets/rotp_twu/textures/power
          sed -e 's/myrotpaddon/rotp_twu/g' -e 's/Example RotP Stand Addon/RotP The World Ultimate/' -e 's/A template for making Stand addons for Ripples of the Past mod./Adds the Stand THE WORLD ULTIMATE: 30s time stop, barrage and launching punch./' -e 's/^logoFile=.*$//' src/main/resources/META-INF/mods.toml > $R/META-INF/mods.toml
          cp src/main/resources/pack.mcmeta $R/
          mkdir -p $R/assets/rotp_twu/geo
          python3 - "$SRC" "$R" <<'PYEND'
          import json, sys
          src, res = sys.argv[1], sys.argv[2]
          d = json.load(open(src + '/src/main/resources/assets/myrotpaddon/geo/example_stand.geo.json'))
          for g in d['minecraft:geometry']:
              g['bones'] = [b for b in g['bones'] if b['name'] != 'pickaxe']
          json.dump(d, open(res + '/assets/rotp_twu/geo/the_world_ultimate.geo.json', 'w'), indent=2)
          PYEND
          SJ=$R/assets/rotp_twu/sounds.json
          echo '{' > $SJ
          FIRST=1
          HS=false
          for n in twu_summon twu_time_stop twu_time_resume twu_blink twu_barrage; do
            if [ -f "$BASE/extra/sounds/$n.ogg" ]; then
              mkdir -p $R/assets/rotp_twu/sounds/stand
              cp "$BASE/extra/sounds/$n.ogg" $R/assets/rotp_twu/sounds/stand/
              if [ $FIRST = 0 ]; then echo ',' >> $SJ; fi
              FIRST=0
              printf '"%s": {"sounds": ["rotp_twu:stand/%s"]}' $n $n >> $SJ
              if [ $n = twu_summon ]; then HS=true; fi
            fi
          done
          echo '}' >> $SJ
          printf 'package com.rotpaddon.twu;\n\npublic class ExtraAssets {\n    public static final boolean HAS_SUMMON = %s;\n}\n' $HS > $P/ExtraAssets.java
          A=src/main/resources/assets/myrotpaddon/textures
          cp $A/entity/stand/example_stand.png $R/assets/rotp_twu/textures/entity/stand/the_world_ultimate.png
          cp $A/power/example_stand.png $R/assets/rotp_twu/textures/power/the_world_ultimate.png
          cp $A/action/example_stand_punch.png $R/assets/rotp_twu/textures/action/twu_punch.png
          cp $A/action/example_stand_barrage.png $R/assets/rotp_twu/textures/action/twu_barrage.png
          cp $A/action/example_stand_block.png $R/assets/rotp_twu/textures/action/twu_block.png
          cp $A/action/example_stand_heavy_punch.png $R/assets/rotp_twu/textures/action/twu_launch_punch.png
          cp $A/action/example_stand_finisher_punch.png $R/assets/rotp_twu/textures/action/twu_time_stop.png
          cp $A/action/example_stand_block.png $R/assets/rotp_twu/textures/action/twu_time_resume.png
          cp $A/action/example_stand_barrage.png $R/assets/rotp_twu/textures/action/twu_grab_throw.png
          cp $A/action/example_stand_finisher_punch.png $R/assets/rotp_twu/textures/action/twu_ground_slam.png
          cp $A/action/example_stand_finisher_punch.png $R/assets/rotp_twu/textures/action/twu_ground_slam_break.png
          cp $A/action/example_stand_heavy_punch.png $R/assets/rotp_twu/textures/action/twu_time_stop_blink.png
          if [ -f "$BASE/extra/the_world_ultimate.png" ]; then cp "$BASE/extra/the_world_ultimate.png" $R/assets/rotp_twu/textures/entity/stand/the_world_ultimate.png; fi
          if [ -f "$BASE/extra/power.png" ]; then cp "$BASE/extra/power.png" $R/assets/rotp_twu/textures/power/the_world_ultimate.png; fi

          cat > $R/assets/rotp_twu/lang/en_us.json <<'EOF'
          {
            "entity.rotp_twu.the_world_ultimate": "The World Ultimate",
            "stand.rotp_twu.the_world_ultimate": "The World Ultimate",
            "action.rotp_twu.twu_punch": "Punch",
            "action.rotp_twu.twu_barrage": "Punch Barrage",
            "action.rotp_twu.twu_launch_punch": "Launching Punch",
            "action.rotp_twu.twu_block": "Block",
            "action.rotp_twu.twu_time_stop": "Time Stop (30s)",
            "action.rotp_twu.twu_time_resume": "Resume Time",
            "action.rotp_twu.twu_time_stop_blink": "Time Stop Blink",
            "action.rotp_twu.twu_grab_throw": "Grab / Throw",
            "action.rotp_twu.twu_ground_slam": "Ground Slam",
            "action.rotp_twu.twu_ground_slam_break": "Ground Slam (breaks blocks)",
            "rotp_twu.message.grabbed": "Grabbed!",
            "rotp_twu.message.nothing": "Nothing to grab",
            "rotp_twu.message.not_holding": "Nothing to throw",
            "rotp_twu.message.escaped": "It broke free!"
          }
          EOF
          cat > $R/assets/rotp_twu/lang/ru_ru.json <<'EOF'
          {
            "entity.rotp_twu.the_world_ultimate": "The World Ultimate",
            "stand.rotp_twu.the_world_ultimate": "The World Ultimate",
            "action.rotp_twu.twu_punch": "Удар",
            "action.rotp_twu.twu_barrage": "Серия ударов",
            "action.rotp_twu.twu_launch_punch": "Удар с подбросом",
            "action.rotp_twu.twu_block": "Блок",
            "action.rotp_twu.twu_time_stop": "Остановка времени (30 с)",
            "action.rotp_twu.twu_time_resume": "Возобновить время",
            "action.rotp_twu.twu_time_stop_blink": "Телепорт в остановленном времени",
            "action.rotp_twu.twu_grab_throw": "Схватить / Швырнуть",
            "action.rotp_twu.twu_ground_slam": "Удар по земле",
            "action.rotp_twu.twu_ground_slam_break": "Удар по земле (ломает блоки)",
            "rotp_twu.message.grabbed": "Схвачено!",
            "rotp_twu.message.nothing": "Нечего хватать",
            "rotp_twu.message.not_holding": "Нечего швырять",
            "rotp_twu.message.escaped": "Вырвался!"
          }
          EOF

          cat > $P/AddonMain.java <<'EOF'
          package com.rotpaddon.twu;

          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;

          import com.rotpaddon.twu.init.InitEntities;
          import com.rotpaddon.twu.init.InitSounds;
          import com.rotpaddon.twu.init.InitStands;

          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;

          @Mod(AddonMain.MOD_ID)
          public class AddonMain {
              public static final String MOD_ID = "rotp_twu";
              public static final Logger LOGGER = LogManager.getLogger();

              public AddonMain() {
                  IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();
                  InitEntities.ENTITIES.register(modEventBus);
                  InitSounds.SOUNDS.register(modEventBus);
                  InitStands.ACTIONS.register(modEventBus);
                  InitStands.STANDS.register(modEventBus);
              }
          }
          EOF

          cat > $P/init/InitEntities.java <<'EOF'
          package com.rotpaddon.twu.init;

          import com.rotpaddon.twu.AddonMain;

          import net.minecraft.entity.EntityType;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;

          public class InitEntities {
              public static final DeferredRegister<EntityType<?>> ENTITIES = DeferredRegister.create(
                      ForgeRegistries.ENTITIES, AddonMain.MOD_ID);
          }
          EOF

          cat > $P/init/InitSounds.java <<'EOF'
          package com.rotpaddon.twu.init;

          import com.rotpaddon.twu.AddonMain;

          import net.minecraft.util.ResourceLocation;
          import net.minecraft.util.SoundEvent;
          import net.minecraftforge.fml.RegistryObject;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;

          public class InitSounds {
              public static final DeferredRegister<SoundEvent> SOUNDS = DeferredRegister.create(
                      ForgeRegistries.SOUND_EVENTS, AddonMain.MOD_ID);

              private static RegistryObject<SoundEvent> reg(String name) {
                  return SOUNDS.register(name, () -> new SoundEvent(new ResourceLocation(AddonMain.MOD_ID, name)));
              }

              // the .ogg files for these events are added to assets/rotp_twu/sounds/stand/
              public static final RegistryObject<SoundEvent> SUMMON = reg("twu_summon");
              public static final RegistryObject<SoundEvent> TIME_STOP = reg("twu_time_stop");
              public static final RegistryObject<SoundEvent> TIME_RESUME = reg("twu_time_resume");
              public static final RegistryObject<SoundEvent> BLINK = reg("twu_blink");
              public static final RegistryObject<SoundEvent> BARRAGE = reg("twu_barrage");
              public static final RegistryObject<SoundEvent> MUDA = reg("twu_muda");
              public static final RegistryObject<SoundEvent> HEAVY_PUNCH = reg("twu_heavy_punch");
          }
          EOF

          cat > $P/entity/TheWorldUltimateEntity.java <<'EOF'
          package com.rotpaddon.twu.entity;

          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.entity.stand.StandEntityType;

          import net.minecraft.world.World;

          public class TheWorldUltimateEntity extends StandEntity {

              public TheWorldUltimateEntity(StandEntityType<TheWorldUltimateEntity> type, World world) {
                  super(type, world);
              }
          }
          EOF

          cat > $P/action/TWULaunchPunch.java <<'EOF'
          package com.rotpaddon.twu.action;

          import com.github.standobyte.jojo.action.stand.StandEntityHeavyAttack;
          import com.github.standobyte.jojo.action.stand.punch.StandEntityPunch;
          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.util.mc.damage.StandEntityDamageSource;

          import net.minecraft.entity.Entity;

          // A heavy punch that throws the target upwards.
          public class TWULaunchPunch extends StandEntityHeavyAttack {

              public TWULaunchPunch(StandEntityHeavyAttack.Builder builder) {
                  super(builder);
              }

              @Override
              public StandEntityPunch punchEntity(StandEntity stand, Entity target, StandEntityDamageSource dmgSource) {
                  // knockbackXRot: pitch of the knockback direction in degrees (negative = upwards).
                  // The World addon uses -30 for a slight lift; -90 sends the target straight up.
                  return super.punchEntity(stand, target, dmgSource)
                          .addKnockback(1.5F)
                          .knockbackXRot(-90.0F)
                          .disableBlocking(1.0F);
              }
          }
          EOF

          cat > $P/action/TWUGrabHandler.java <<'EOF'
          package com.rotpaddon.twu.action;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import java.util.Optional;
          import java.util.UUID;

          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.rotpaddon.twu.AddonMain;

          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.MobEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.DamageSource;
          import net.minecraft.util.math.AxisAlignedBB;
          import net.minecraft.util.math.vector.Vector3d;
          import net.minecraft.util.text.TranslationTextComponent;
          import net.minecraft.world.World;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.player.PlayerEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          // Grab a mob with the Stand (it is held in the Stand's hand, struggles and may break free),
          // then throw it like a projectile.
          @Mod.EventBusSubscriber(modid = AddonMain.MOD_ID)
          public class TWUGrabHandler {
              private static final double RANGE = 6.0D;
              private static final double HAND_FORWARD = 1.3D;
              private static final double THROW_SPEED = 2.0D;
              private static final float HIT_DAMAGE = 8.0F;
              private static final float IMPACT_DAMAGE = 6.0F;
              private static final float STRUGGLE_LIMIT = 100.0F;

              private static class Held {
                  final Entity entity;
                  final StandEntity stand;
                  float struggle = 0.0F;
                  Held(Entity entity, StandEntity stand) { this.entity = entity; this.stand = stand; }
              }

              private static class Thrown {
                  final Entity entity;
                  int ticks = 0;
                  Thrown(Entity entity) { this.entity = entity; }
              }

              private static final Map<UUID, Held> HELD = new HashMap<>();
              private static final Map<UUID, List<Thrown>> THROWN = new HashMap<>();

              // ------------------------------------------------------------------ actions

              public static void grab(PlayerEntity player, StandEntity stand) {
                  if (HELD.containsKey(player.getUUID())) return;
                  LivingEntity target = findLivingTarget(player);
                  if (target == null) {
                      player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.nothing"), true);
                      return;
                  }
                  if (target instanceof MobEntity) {
                      ((MobEntity) target).setNoAi(true);
                  }
                  target.setNoGravity(true);
                  HELD.put(player.getUUID(), new Held(target, stand));
                  player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.grabbed"), true);
              }

              // one button: holding something -> throw it, otherwise grab
              public static void toggle(PlayerEntity player, StandEntity stand) {
                  if (HELD.containsKey(player.getUUID())) {
                      throwHeld(player);
                  }
                  else {
                      grab(player, stand);
                  }
              }

              public static void throwHeld(PlayerEntity player) {
                  Held held = HELD.remove(player.getUUID());
                  if (held == null) {
                      player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.not_holding"), true);
                      return;
                  }
                  Entity entity = held.entity;
                  if (!entity.isAlive()) return;
                  release(entity);
                  Vector3d look = player.getLookAngle();
                  entity.setDeltaMovement(look.x * THROW_SPEED, look.y * THROW_SPEED + 0.3D, look.z * THROW_SPEED);
                  entity.hurtMarked = true;
                  THROWN.computeIfAbsent(player.getUUID(), id -> new ArrayList<>()).add(new Thrown(entity));
              }

              private static LivingEntity findLivingTarget(PlayerEntity player) {
                  World world = player.level;
                  Vector3d from = player.getEyePosition(1.0F);
                  Vector3d look = player.getLookAngle();
                  Vector3d to = from.add(look.scale(RANGE));
                  LivingEntity best = null;
                  double bestDist = RANGE * RANGE;
                  AxisAlignedBB area = player.getBoundingBox().expandTowards(look.scale(RANGE)).inflate(1.0D);
                  List<Entity> candidates = world.getEntities(player, area,
                          e -> e instanceof LivingEntity && !(e instanceof PlayerEntity) && !(e instanceof StandEntity) && e.isAlive());
                  for (Entity e : candidates) {
                      Optional<Vector3d> hit = e.getBoundingBox().inflate(0.3D).clip(from, to);
                      if (hit.isPresent()) {
                          double dist = from.distanceToSqr(hit.get());
                          if (dist < bestDist) {
                              bestDist = dist;
                              best = (LivingEntity) e;
                          }
                      }
                  }
                  return best;
              }

              private static void release(Entity entity) {
                  entity.setNoGravity(false);
                  entity.fallDistance = 0.0F;
                  if (entity instanceof MobEntity) {
                      ((MobEntity) entity).setNoAi(false);
                  }
              }

              // the point where the Stand's hand is: in front of the Stand, at chest height
              private static Vector3d handPos(PlayerEntity player, Held held) {
                  Vector3d look = player.getLookAngle();
                  Vector3d forward = new Vector3d(look.x, 0.0D, look.z).normalize();
                  if (held.stand != null && held.stand.isAlive()) {
                      return held.stand.position().add(forward.scale(HAND_FORWARD)).add(0.0D, held.stand.getBbHeight() * 0.65D, 0.0D);
                  }
                  return player.getEyePosition(1.0F).add(look.scale(2.5D));
              }

              // ------------------------------------------------------------------ events

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  PlayerEntity player = event.player;
                  if (player.level.isClientSide) return;
                  UUID id = player.getUUID();
                  tickHeld(player, id);
                  tickThrown(player, id);
              }

              private static void tickHeld(PlayerEntity player, UUID id) {
                  Held held = HELD.get(id);
                  if (held == null) return;
                  Entity e = held.entity;
                  boolean standGone = held.stand != null && !held.stand.isAlive();
                  if (!player.isAlive() || !e.isAlive() || e.level != player.level || standGone) {
                      HELD.remove(id);
                      if (e.isAlive()) release(e);
                      return;
                  }
                  // the victim struggles; stronger (more health) victims break free faster
                  if (e instanceof LivingEntity) {
                      held.struggle += 0.5F + ((LivingEntity) e).getMaxHealth() * 0.04F;
                      if (held.struggle >= STRUGGLE_LIMIT) {
                          HELD.remove(id);
                          release(e);
                          player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.escaped"), true);
                          return;
                      }
                  }
                  Vector3d pos = handPos(player, held);
                  e.setPos(pos.x, pos.y - e.getBbHeight() / 2.0D, pos.z);
                  e.setDeltaMovement(Vector3d.ZERO);
                  e.fallDistance = 0.0F;
                  e.hurtMarked = true;
              }

              private static void tickThrown(PlayerEntity player, UUID id) {
                  List<Thrown> list = THROWN.get(id);
                  if (list == null) return;
                  Iterator<Thrown> it = list.iterator();
                  while (it.hasNext()) {
                      Thrown t = it.next();
                      Entity e = t.entity;
                      t.ticks++;
                      if (!e.isAlive() || t.ticks > 80) {
                          it.remove();
                          continue;
                      }
                      List<Entity> hits = player.level.getEntities(e, e.getBoundingBox().inflate(0.4D),
                              x -> x instanceof LivingEntity && x != player && !(x instanceof StandEntity) && x.isAlive());
                      boolean landed = t.ticks > 4 && (e.isOnGround() || e.horizontalCollision);
                      if (t.ticks > 2 && (!hits.isEmpty() || landed)) {
                          for (Entity victim : hits) {
                              victim.hurt(DamageSource.playerAttack(player), HIT_DAMAGE);
                          }
                          if (e instanceof LivingEntity) {
                              e.hurt(DamageSource.playerAttack(player), IMPACT_DAMAGE);
                          }
                          it.remove();
                      }
                  }
                  if (list.isEmpty()) THROWN.remove(id);
              }

              @SubscribeEvent
              public static void onPlayerLogout(PlayerEvent.PlayerLoggedOutEvent event) {
                  UUID id = event.getPlayer().getUUID();
                  Held held = HELD.remove(id);
                  if (held != null && held.entity.isAlive()) release(held.entity);
                  THROWN.remove(id);
              }
          }
          EOF

          cat > $P/action/TWUGrabThrow.java <<'EOF'
          package com.rotpaddon.twu.action;

          import com.github.standobyte.jojo.action.stand.StandEntityAction;
          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.entity.stand.StandEntityTask;
          import com.github.standobyte.jojo.power.impl.stand.IStandPower;

          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.world.World;

          // One button: the first use grabs the mob you look at, the next use throws it.
          public class TWUGrabThrow extends StandEntityAction {

              public TWUGrabThrow(StandEntityAction.Builder builder) {
                  super(builder);
              }

              @Override
              public void standPerform(World world, StandEntity standEntity, IStandPower userPower, StandEntityTask task) {
                  if (world.isClientSide) return;
                  LivingEntity user = standEntity.getUser();
                  if (user instanceof PlayerEntity) {
                      TWUGrabHandler.toggle((PlayerEntity) user, standEntity);
                  }
              }
          }
          EOF

          cat > $P/action/TWUPoses.java <<'EOF'
          package com.rotpaddon.twu.action;

          import com.github.standobyte.jojo.entity.stand.StandPose;

          public class TWUPoses {
              // the pose of the Stand while its user moves in stopped time
              public static final StandPose TIME_STOP = new StandPose("twu_time_stop");
          }
          EOF

          cat > $P/action/TWUTimeStopPoseHandler.java <<'EOF'
          package com.rotpaddon.twu.action;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          import com.github.standobyte.jojo.capability.world.TimeStopHandler;
          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.entity.stand.StandPose;
          import com.github.standobyte.jojo.init.ModStatusEffects;
          import com.github.standobyte.jojo.power.impl.stand.IStandManifestation;
          import com.github.standobyte.jojo.power.impl.stand.IStandPower;
          import com.rotpaddon.twu.AddonMain;
          import com.rotpaddon.twu.init.InitStands;

          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          // While the Stand's user moves in stopped time, the Stand holds the time stop pose.
          @Mod.EventBusSubscriber(modid = AddonMain.MOD_ID)
          public class TWUTimeStopPoseHandler {
              private static final Set<UUID> POSED = new HashSet<>();

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  PlayerEntity player = event.player;
                  if (player.level.isClientSide) return;
                  UUID id = player.getUUID();
                  boolean movesInStoppedTime = TimeStopHandler.isTimeStopped(player.level, player.blockPosition())
                          && !player.hasEffect(ModStatusEffects.TIME_STOP.get());
                  if (movesInStoppedTime) {
                      if (setPose(player, TWUPoses.TIME_STOP)) {
                          POSED.add(id);
                      }
                  }
                  else if (POSED.remove(id)) {
                      setPose(player, StandPose.IDLE);
                  }
              }

              private static boolean setPose(PlayerEntity player, StandPose pose) {
                  boolean[] done = new boolean[1];
                  IStandPower.getStandPowerOptional(player).ifPresent(power -> {
                      if (power.getType().equals(InitStands.STAND_THE_WORLD_ULTIMATE.getStandType())) {
                          IStandManifestation manifestation = power.getStandManifestation();
                          if (manifestation instanceof StandEntity) {
                              ((StandEntity) manifestation).setStandPose(pose);
                              done[0] = true;
                          }
                      }
                  });
                  return done[0];
              }
          }
          EOF

          cat > $P/action/TWUGroundSlam.java <<'EOF'
          package com.rotpaddon.twu.action;

          import com.github.standobyte.jojo.action.stand.StandEntityAction;
          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.entity.stand.StandEntityTask;
          import com.github.standobyte.jojo.power.impl.stand.IStandPower;

          import net.minecraft.block.BlockState;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.particles.BlockParticleData;
          import net.minecraft.particles.ParticleTypes;
          import net.minecraft.util.DamageSource;
          import net.minecraft.util.SoundCategory;
          import net.minecraft.util.SoundEvents;
          import net.minecraft.util.math.AxisAlignedBB;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.vector.Vector3d;
          import net.minecraft.world.World;
          import net.minecraft.world.server.ServerWorld;

          // The Stand steps 2 blocks forward and smashes the ground with its hand: every mob around
          // the impact is knocked back and takes a little damage. The shift version also breaks blocks.
          public class TWUGroundSlam extends StandEntityAction {
              private static final double FORWARD = 2.0D;
              private static final double RADIUS = 3.5D;
              private static final float DAMAGE = 4.0F;
              private static final float MAX_BREAK_HARDNESS = 5.0F;

              private final boolean breakBlocks;

              public TWUGroundSlam(StandEntityAction.Builder builder, boolean breakBlocks) {
                  super(builder);
                  this.breakBlocks = breakBlocks;
              }

              @Override
              public void standPerform(World world, StandEntity standEntity, IStandPower userPower, StandEntityTask task) {
                  if (world.isClientSide) return;
                  LivingEntity user = standEntity.getUser();
                  if (user == null) return;

                  Vector3d look = user.getLookAngle();
                  Vector3d forward = new Vector3d(look.x, 0.0D, look.z);
                  forward = forward.lengthSqr() < 1.0E-4D ? new Vector3d(0.0D, 0.0D, 1.0D) : forward.normalize();
                  Vector3d impact = user.position().add(forward.scale(FORWARD));

                  // the Stand steps forward (it is held there for a few ticks)
                  standEntity.moveTo(impact.x, user.getY(), impact.z, user.yRot, 0.0F);
                  TWUSlamHandler.holdStand(standEntity, impact.x, user.getY(), impact.z, user.yRot);

                  BlockPos ground = findGround(world, new BlockPos(impact.x, user.getY() - 0.5D, impact.z));

                  // knock back and damage everything around the impact point
                  AxisAlignedBB area = new AxisAlignedBB(impact.x - RADIUS, user.getY() - 1.0D, impact.z - RADIUS,
                          impact.x + RADIUS, user.getY() + 3.0D, impact.z + RADIUS);
                  DamageSource source = user instanceof PlayerEntity ? DamageSource.playerAttack((PlayerEntity) user) : DamageSource.mobAttack(user);
                  for (Entity e : world.getEntities(user, area, x -> x instanceof LivingEntity && !(x instanceof StandEntity) && x.isAlive())) {
                      Vector3d away = new Vector3d(e.getX() - impact.x, 0.0D, e.getZ() - impact.z);
                      away = away.lengthSqr() < 1.0E-4D ? forward : away.normalize();
                      e.hurt(source, DAMAGE);
                      e.setDeltaMovement(away.x * 1.3D, 0.5D, away.z * 1.3D);
                      e.hurtMarked = true;
                  }

                  // the shift version also breaks the ground
                  if (breakBlocks) {
                      for (int dx = -2; dx <= 2; dx++) {
                          for (int dz = -2; dz <= 2; dz++) {
                              if (dx * dx + dz * dz > 6) continue;
                              for (int dy = 0; dy >= -1; dy--) {
                                  BlockPos pos = ground.offset(dx, dy, dz);
                                  BlockState state = world.getBlockState(pos);
                                  float hardness = state.getDestroySpeed(world, pos);
                                  if (!state.isAir(world, pos) && hardness >= 0.0F && hardness <= MAX_BREAK_HARDNESS
                                          && !state.hasTileEntity() && state.getFluidState().isEmpty()) {
                                      world.destroyBlock(pos, true);
                                  }
                              }
                          }
                      }
                  }

                  // effects
                  BlockState groundState = world.getBlockState(ground);
                  if (world instanceof ServerWorld) {
                      ServerWorld serverWorld = (ServerWorld) world;
                      serverWorld.sendParticles(ParticleTypes.EXPLOSION, impact.x, ground.getY() + 1.0D, impact.z, 2, 0.5D, 0.1D, 0.5D, 0.0D);
                      if (!groundState.isAir(world, ground)) {
                          serverWorld.sendParticles(new BlockParticleData(ParticleTypes.BLOCK, groundState),
                                  impact.x, ground.getY() + 1.1D, impact.z, 40, 1.2D, 0.2D, 1.2D, 0.15D);
                      }
                  }
                  world.playSound(null, impact.x, ground.getY() + 1.0D, impact.z, SoundEvents.GENERIC_EXPLODE, SoundCategory.PLAYERS, 0.8F, 1.3F);
              }

              // the block under the impact point (searching a few blocks down if it is hovering over air)
              private static BlockPos findGround(World world, BlockPos start) {
                  BlockPos pos = start;
                  for (int i = 0; i < 4 && world.getBlockState(pos).isAir(world, pos); i++) {
                      pos = pos.below();
                  }
                  return pos;
              }
          }
          EOF

          cat > $P/action/TWUSlamHandler.java <<'EOF'
          package com.rotpaddon.twu.action;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.rotpaddon.twu.AddonMain;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          // Keeps the Stand where the slam happened for a few ticks (after all entities have ticked),
          // so it does not immediately snap back to its user.
          @Mod.EventBusSubscriber(modid = AddonMain.MOD_ID)
          public class TWUSlamHandler {
              private static final int HOLD_TICKS = 12;

              private static class Hold {
                  final StandEntity stand;
                  final double x, y, z;
                  final float yaw;
                  int ticks = HOLD_TICKS;
                  Hold(StandEntity stand, double x, double y, double z, float yaw) {
                      this.stand = stand; this.x = x; this.y = y; this.z = z; this.yaw = yaw;
                  }
              }

              private static final List<Hold> HOLDS = new ArrayList<>();

              public static void holdStand(StandEntity stand, double x, double y, double z, float yaw) {
                  HOLDS.removeIf(h -> h.stand == stand);
                  HOLDS.add(new Hold(stand, x, y, z, yaw));
              }

              @SubscribeEvent
              public static void onWorldTick(TickEvent.WorldTickEvent event) {
                  if (event.phase != TickEvent.Phase.END || event.world.isClientSide) return;
                  Iterator<Hold> it = HOLDS.iterator();
                  while (it.hasNext()) {
                      Hold h = it.next();
                      if (h.stand.level != event.world) continue;
                      if (!h.stand.isAlive() || --h.ticks <= 0) {
                          it.remove();
                          continue;
                      }
                      h.stand.moveTo(h.x, h.y, h.z, h.yaw, 0.0F);
                  }
              }
          }
          EOF

          cat > $P/init/InitStands.java <<'EOF'
          package com.rotpaddon.twu.init;

          import com.github.standobyte.jojo.action.Action;
          import com.github.standobyte.jojo.action.stand.StandAction;
          import com.github.standobyte.jojo.action.stand.StandEntityAction;
          import com.github.standobyte.jojo.action.stand.StandEntityBlock;
          import com.github.standobyte.jojo.action.stand.StandEntityHeavyAttack;
          import com.github.standobyte.jojo.action.stand.StandEntityLightAttack;
          import com.github.standobyte.jojo.action.stand.StandEntityMeleeBarrage;
          import com.github.standobyte.jojo.action.stand.TimeResume;
          import com.github.standobyte.jojo.action.stand.TimeStop;
          import com.github.standobyte.jojo.action.stand.TimeStopInstant;
          import com.github.standobyte.jojo.entity.stand.StandEntityType;
          import com.github.standobyte.jojo.entity.stand.StandPose;
          import com.github.standobyte.jojo.init.ModSounds;
          import com.github.standobyte.jojo.init.power.stand.EntityStandRegistryObject;
          import com.github.standobyte.jojo.init.power.stand.ModStandsInit;
          import com.github.standobyte.jojo.power.impl.stand.StandInstance.StandPart;
          import com.github.standobyte.jojo.power.impl.stand.stats.TimeStopperStandStats;
          import com.github.standobyte.jojo.power.impl.stand.type.EntityStandType;
          import com.github.standobyte.jojo.power.impl.stand.type.StandType;
          import com.rotpaddon.twu.AddonMain;
          import com.rotpaddon.twu.action.TWUGrabThrow;
          import com.rotpaddon.twu.action.TWUGroundSlam;
          import com.rotpaddon.twu.action.TWULaunchPunch;
          import com.rotpaddon.twu.entity.TheWorldUltimateEntity;

          import net.minecraftforge.fml.RegistryObject;
          import net.minecraftforge.registries.DeferredRegister;

          public class InitStands {
              @SuppressWarnings("unchecked")
              public static final DeferredRegister<Action<?>> ACTIONS = DeferredRegister.create(
                      (Class<Action<?>>) ((Class<?>) Action.class), AddonMain.MOD_ID);
              @SuppressWarnings("unchecked")
              public static final DeferredRegister<StandType<?>> STANDS = DeferredRegister.create(
                      (Class<StandType<?>>) ((Class<?>) StandType.class), AddonMain.MOD_ID);

              // ======================================== The World Ultimate ========================================

              public static final RegistryObject<StandEntityAction> TWU_PUNCH = ACTIONS.register("twu_punch",
                      () -> new StandEntityLightAttack(new StandEntityLightAttack.Builder()
                              .punchSound(ModSounds.STAND_PUNCH_LIGHT)));

              // Series of fast punches (MUDA voice + punching sound)
              public static final RegistryObject<StandEntityAction> TWU_BARRAGE = ACTIONS.register("twu_barrage",
                      () -> new StandEntityMeleeBarrage(new StandEntityMeleeBarrage.Builder()
                              .barrageHitSound(ModSounds.STAND_PUNCH_LIGHT)
                              .standSound(InitSounds.MUDA, InitSounds.BARRAGE)));

              // Powerful punch that launches mobs upwards (shift + Punch / Barrage)
              public static final RegistryObject<StandEntityHeavyAttack> TWU_LAUNCH_PUNCH = ACTIONS.register("twu_launch_punch",
                      () -> new TWULaunchPunch(new StandEntityHeavyAttack.Builder()
                              .shiftVariationOf(TWU_PUNCH).shiftVariationOf(TWU_BARRAGE)
                              .punchSound(InitSounds.HEAVY_PUNCH)
                              .partsRequired(StandPart.ARMS)));

              // One button: grab the mob you look at, press again to throw it
              public static final RegistryObject<StandEntityAction> TWU_GRAB_THROW = ACTIONS.register("twu_grab_throw",
                      () -> new TWUGrabThrow(new StandEntityAction.Builder()
                              .standPose(StandPose.HEAVY_ATTACK)
                              .staminaCost(30.0F)
                              .standUserWalkSpeed(1.0F)
                              .partsRequired(StandPart.ARMS)));

              // The Stand steps 2 blocks forward and smashes the ground: knockback + a little damage
              public static final RegistryObject<StandEntityAction> TWU_GROUND_SLAM = ACTIONS.register("twu_ground_slam",
                      () -> new TWUGroundSlam(new StandEntityAction.Builder()
                              .standPose(StandPose.HEAVY_ATTACK_FINISHER)
                              .staminaCost(40.0F)
                              .cooldown(60)
                              .standUserWalkSpeed(1.0F)
                              .partsRequired(StandPart.ARMS), false));

              // The same, but it also breaks blocks (shift)
              public static final RegistryObject<StandEntityAction> TWU_GROUND_SLAM_BREAK = ACTIONS.register("twu_ground_slam_break",
                      () -> new TWUGroundSlam(new StandEntityAction.Builder()
                              .shiftVariationOf(TWU_GROUND_SLAM)
                              .standPose(StandPose.HEAVY_ATTACK_FINISHER)
                              .staminaCost(50.0F)
                              .cooldown(80)
                              .standUserWalkSpeed(1.0F)
                              .partsRequired(StandPart.ARMS), true));

              public static final RegistryObject<StandEntityAction> TWU_BLOCK = ACTIONS.register("twu_block",
                      () -> new StandEntityBlock());

              // Time stop: 600 ticks = 30 seconds
              public static final RegistryObject<TimeStop> TWU_TIME_STOP = ACTIONS.register("twu_time_stop",
                      () -> new TimeStop(new TimeStop.Builder()
                              .timeStopMaxTicks(600, 600)
                              .timeStopSound(InitSounds.TIME_STOP)
                              .timeResumeSound(InitSounds.TIME_RESUME)
                              .staminaCost(100)
                              .staminaCostTick(0.4F)));

              // Shift + Time Stop while time is stopped: resume time
              public static final RegistryObject<TimeResume> TWU_TIME_RESUME = ACTIONS.register("twu_time_resume",
                      () -> new TimeResume(new StandAction.Builder()
                              .shiftVariationOf(TWU_TIME_STOP)));

              // Shift + Time Stop: teleport (blink)
              public static final RegistryObject<TimeStopInstant> TWU_TIME_STOP_BLINK = ACTIONS.register("twu_time_stop_blink",
                      () -> new TimeStopInstant(new StandAction.Builder()
                              .ignoresPerformerStun()
                              .partsRequired(StandPart.MAIN_BODY),
                              TWU_TIME_STOP, InitSounds.BLINK, false));

              public static final EntityStandRegistryObject<EntityStandType<TimeStopperStandStats>, StandEntityType<TheWorldUltimateEntity>> STAND_THE_WORLD_ULTIMATE =
                      new EntityStandRegistryObject<>("the_world_ultimate",
                              STANDS,
                              () -> new EntityStandType.Builder<TimeStopperStandStats>()
                              .color(0xF2C500)
                              .storyPartName(ModStandsInit.PART_3_NAME)
                              .leftClickHotbar(
                                      TWU_PUNCH.get(),
                                      TWU_BARRAGE.get()
                                      )
                              .rightClickHotbar(
                                      TWU_BLOCK.get(),
                                      TWU_TIME_STOP.get(),
                                      TWU_GRAB_THROW.get(),
                                      TWU_GROUND_SLAM.get()
                                      )
                              .defaultStats(TimeStopperStandStats.class, new TimeStopperStandStats.Builder()
                                      .tier(6)
                                      .power(20)
                                      .speed(20)
                                      .range(50, 100)
                                      .durability(20)
                                      .precision(20)
                                      .build())
                              .build(),

                              InitEntities.ENTITIES,
                              () -> new StandEntityType<TheWorldUltimateEntity>(TheWorldUltimateEntity::new, 0.7F, 2.15F)
                              .summonSound(InitSounds.SUMMON)
                              .unsummonSound(ModSounds.STAND_UNSUMMON_DEFAULT))
                      .withDefaultStandAttributes();
          }
          EOF

