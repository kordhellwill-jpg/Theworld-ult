name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Generate project
        run: |
          git clone --depth 1 https://github.com/StandoByte/RotP-Addon-example.git tpl
          set -e
          BASE=$PWD
          SRC=$BASE/tpl
          OUT=$BASE/out
          rm -rf $OUT && mkdir -p $OUT && cd $SRC
          cp -r gradle gradlew gradlew.bat .gitignore .gitattributes LICENSE gradle.properties $OUT/
          sed -e "s/archivesBaseName = 'RotP-AddonExample'/archivesBaseName = 'RotP-TheWorldUltimate'/" -e "s/com.yourname.modid/com.rotpaddon.twu/" build.gradle > $OUT/build.gradle
          P=$OUT/src/main/java/com/rotpaddon/twu
          R=$OUT/src/main/resources
          mkdir -p $P/init $P/action $P/entity $P/client/render $R/META-INF
          mkdir -p $R/assets/rotp_twu/lang $R/assets/rotp_twu/textures/action $R/assets/rotp_twu/textures/entity/stand $R/assets/rotp_twu/textures/power
          sed -e 's/myrotpaddon/rotp_twu/g' -e 's/Example RotP Stand Addon/RotP The World Ultimate/' -e 's/A template for making Stand addons for Ripples of the Past mod./Adds the Stand THE WORLD ULTIMATE: 30s time stop, barrage and launching punch./' -e 's/^logoFile=.*$//' src/main/resources/META-INF/mods.toml > $R/META-INF/mods.toml
          cp src/main/resources/pack.mcmeta $R/
          mkdir -p $R/assets/rotp_twu/geo
          python3 - "$SRC" "$R" <<'PYEND'
          import json, sys
          src, res = sys.argv[1], sys.argv[2]
          d = json.load(open(src + '/src/main/resources/assets/myrotpaddon/geo/example_stand.geo.json'))
          for g in d['minecraft:geometry']:
              g['bones'] = [b for b in g['bones'] if b['name'] != 'pickaxe']
          json.dump(d, open(res + '/assets/rotp_twu/geo/the_world_ultimate.geo.json', 'w'), indent=2)
          PYEND
          SJ=$R/assets/rotp_twu/sounds.json
          echo '{' > $SJ
          FIRST=1
          HS=false
          for n in twu_summon twu_time_stop twu_time_resume twu_blink twu_barrage; do
            if [ -f "$BASE/extra/sounds/$n.ogg" ]; then
              mkdir -p $R/assets/rotp_twu/sounds/stand
              cp "$BASE/extra/sounds/$n.ogg" $R/assets/rotp_twu/sounds/stand/
              if [ $FIRST = 0 ]; then echo ',' >> $SJ; fi
              FIRST=0
              printf '"%s": {"sounds": ["rotp_twu:stand/%s"]}' $n $n >> $SJ
              if [ $n = twu_summon ]; then HS=true; fi
            fi
          done
          echo '}' >> $SJ
          printf 'package com.rotpaddon.twu;\n\npublic class ExtraAssets {\n    public static final boolean HAS_SUMMON = %s;\n}\n' $HS > $P/ExtraAssets.java
          A=src/main/resources/assets/myrotpaddon/textures
          cp $A/entity/stand/example_stand.png $R/assets/rotp_twu/textures/entity/stand/the_world_ultimate.png
          cp $A/power/example_stand.png $R/assets/rotp_twu/textures/power/the_world_ultimate.png
          cp $A/action/example_stand_punch.png $R/assets/rotp_twu/textures/action/twu_punch.png
          cp $A/action/example_stand_barrage.png $R/assets/rotp_twu/textures/action/twu_barrage.png
          cp $A/action/example_stand_block.png $R/assets/rotp_twu/textures/action/twu_block.png
          cp $A/action/example_stand_heavy_punch.png $R/assets/rotp_twu/textures/action/twu_launch_punch.png
          cp $A/action/example_stand_finisher_punch.png $R/assets/rotp_twu/textures/action/twu_time_stop.png
          cp $A/action/example_stand_block.png $R/assets/rotp_twu/textures/action/twu_time_resume.png
          cp $A/action/example_stand_barrage.png $R/assets/rotp_twu/textures/action/twu_grab_throw.png
          cp $A/action/example_stand_finisher_punch.png $R/assets/rotp_twu/textures/action/twu_air_barrage.png
          cp $A/action/example_stand_heavy_punch.png $R/assets/rotp_twu/textures/action/twu_time_stop_blink.png
          if [ -f "$BASE/extra/the_world_ultimate.png" ]; then cp "$BASE/extra/the_world_ultimate.png" $R/assets/rotp_twu/textures/entity/stand/the_world_ultimate.png; fi
          if [ -f "$BASE/extra/power.png" ]; then cp "$BASE/extra/power.png" $R/assets/rotp_twu/textures/power/the_world_ultimate.png; fi

          cat > $R/assets/rotp_twu/lang/en_us.json <<'EOF'
          {
            "entity.rotp_twu.the_world_ultimate": "The World Ultimate",
            "stand.rotp_twu.the_world_ultimate": "The World Ultimate",
            "action.rotp_twu.twu_punch": "Punch",
            "action.rotp_twu.twu_barrage": "Punch Barrage",
            "action.rotp_twu.twu_launch_punch": "Launching Punch",
            "action.rotp_twu.twu_block": "Block",
            "action.rotp_twu.twu_time_stop": "Time Stop (30s)",
            "action.rotp_twu.twu_time_resume": "Resume Time",
            "action.rotp_twu.twu_time_stop_blink": "Time Stop Blink",
            "action.rotp_twu.twu_grab_throw": "Grab / Throw",
            "rotp_twu.message.grabbed": "Grabbed! Use again to throw",
            "rotp_twu.message.nothing": "Nothing to grab",
            "rotp_twu.message.escaped": "It broke free!",
            "action.rotp_twu.twu_air_barrage": "Air Barrage"
          }
          EOF
          cat > $R/assets/rotp_twu/lang/ru_ru.json <<'EOF'
          {
            "entity.rotp_twu.the_world_ultimate": "The World Ultimate",
            "stand.rotp_twu.the_world_ultimate": "The World Ultimate",
            "action.rotp_twu.twu_punch": "Удар",
            "action.rotp_twu.twu_barrage": "Серия ударов",
            "action.rotp_twu.twu_launch_punch": "Удар с подбросом",
            "action.rotp_twu.twu_block": "Блок",
            "action.rotp_twu.twu_time_stop": "Остановка времени (30 с)",
            "action.rotp_twu.twu_time_resume": "Возобновить время",
            "action.rotp_twu.twu_time_stop_blink": "Телепорт в остановленном времени",
            "action.rotp_twu.twu_grab_throw": "Схватить / Швырнуть",
            "rotp_twu.message.grabbed": "Схвачено! Повтори, чтобы швырнуть",
            "rotp_twu.message.nothing": "Нечего хватать",
            "rotp_twu.message.escaped": "Вырвался!",
            "action.rotp_twu.twu_air_barrage": "Воздушный шквал"
          }
          EOF

          cat > $P/AddonMain.java <<'EOF'
          package com.rotpaddon.twu;

          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;

          import com.rotpaddon.twu.init.InitEntities;
          import com.rotpaddon.twu.init.InitSounds;
          import com.rotpaddon.twu.init.InitStands;

          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;

          @Mod(AddonMain.MOD_ID)
          public class AddonMain {
              public static final String MOD_ID = "rotp_twu";
              public static final Logger LOGGER = LogManager.getLogger();

              public AddonMain() {
                  IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();
                  InitEntities.ENTITIES.register(modEventBus);
                  InitSounds.SOUNDS.register(modEventBus);
                  InitStands.ACTIONS.register(modEventBus);
                  InitStands.STANDS.register(modEventBus);
              }
          }
          EOF

          cat > $P/init/InitEntities.java <<'EOF'
          package com.rotpaddon.twu.init;

          import com.rotpaddon.twu.AddonMain;

          import net.minecraft.entity.EntityType;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;

          public class InitEntities {
              public static final DeferredRegister<EntityType<?>> ENTITIES = DeferredRegister.create(
                      ForgeRegistries.ENTITIES, AddonMain.MOD_ID);
          }
          EOF

          cat > $P/init/InitSounds.java <<'EOF'
          package com.rotpaddon.twu.init;

          import java.util.function.Supplier;

          import com.github.standobyte.jojo.init.ModSounds;
          import com.rotpaddon.twu.AddonMain;
          import com.rotpaddon.twu.ExtraAssets;

          import net.minecraft.util.ResourceLocation;
          import net.minecraft.util.SoundEvent;
          import net.minecraftforge.fml.RegistryObject;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;

          public class InitSounds {
              public static final DeferredRegister<SoundEvent> SOUNDS = DeferredRegister.create(
                      ForgeRegistries.SOUND_EVENTS, AddonMain.MOD_ID);

              private static RegistryObject<SoundEvent> reg(String name) {
                  return SOUNDS.register(name, () -> new SoundEvent(new ResourceLocation(AddonMain.MOD_ID, name)));
              }

              // Sound files are optional: put .ogg files named like these into the repo folder extra/sounds/
              public static final RegistryObject<SoundEvent> SUMMON = reg("twu_summon");
              public static final RegistryObject<SoundEvent> TIME_STOP = reg("twu_time_stop");
              public static final RegistryObject<SoundEvent> TIME_RESUME = reg("twu_time_resume");
              public static final RegistryObject<SoundEvent> BLINK = reg("twu_blink");
              public static final RegistryObject<SoundEvent> BARRAGE = reg("twu_barrage");

              // If there is no twu_summon.ogg, the default RotP summon sound is used.
              public static final Supplier<SoundEvent> SUMMON_OR_DEFAULT = ExtraAssets.HAS_SUMMON
                      ? (Supplier<SoundEvent>) SUMMON
                      : (Supplier<SoundEvent>) ModSounds.STAND_SUMMON_DEFAULT;
          }
          EOF

          cat > $P/entity/TheWorldUltimateEntity.java <<'EOF'
          package com.rotpaddon.twu.entity;

          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.entity.stand.StandEntityType;

          import net.minecraft.world.World;

          public class TheWorldUltimateEntity extends StandEntity {

              public TheWorldUltimateEntity(StandEntityType<TheWorldUltimateEntity> type, World world) {
                  super(type, world);
              }
          }
          EOF

          cat > $P/action/TWULaunchPunch.java <<'EOF'
          package com.rotpaddon.twu.action;

          import com.github.standobyte.jojo.action.stand.StandEntityHeavyAttack;
          import com.github.standobyte.jojo.action.stand.punch.StandEntityPunch;
          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.github.standobyte.jojo.util.mc.damage.StandEntityDamageSource;

          import net.minecraft.entity.Entity;

          // A heavy punch that throws the target upwards.
          public class TWULaunchPunch extends StandEntityHeavyAttack {

              public TWULaunchPunch(StandEntityHeavyAttack.Builder builder) {
                  super(builder);
              }

              @Override
              public StandEntityPunch punchEntity(StandEntity stand, Entity target, StandEntityDamageSource dmgSource) {
                  // knockbackXRot: pitch of the knockback direction in degrees (negative = upwards).
                  // The World addon uses -30 for a slight lift; -90 sends the target straight up.
                  return super.punchEntity(stand, target, dmgSource)
                          .addKnockback(1.5F)
                          .knockbackXRot(-90.0F)
                          .disableBlocking(1.0F);
              }
          }
          EOF

          cat > $P/action/TWUGrabHandler.java <<'EOF'
          package com.rotpaddon.twu.action;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import java.util.Optional;
          import java.util.UUID;

          import com.github.standobyte.jojo.entity.stand.StandEntity;
          import com.rotpaddon.twu.AddonMain;

          import net.minecraft.block.BlockState;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.MobEntity;
          import net.minecraft.entity.item.FallingBlockEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.particles.ParticleTypes;
          import net.minecraft.util.DamageSource;
          import net.minecraft.util.SoundCategory;
          import net.minecraft.util.SoundEvents;
          import net.minecraft.util.math.AxisAlignedBB;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.BlockRayTraceResult;
          import net.minecraft.util.math.RayTraceContext;
          import net.minecraft.util.math.RayTraceResult;
          import net.minecraft.util.math.vector.Vector3d;
          import net.minecraft.util.text.TranslationTextComponent;
          import net.minecraft.world.World;
          import net.minecraft.world.server.ServerWorld;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.player.PlayerEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          // Grab (held in the Stand's hand, the victim struggles and may break free) / throw,
          // and the air barrage: toss a mob up and hit it many times in the air.
          @Mod.EventBusSubscriber(modid = AddonMain.MOD_ID)
          public class TWUGrabHandler {
              private static final double RANGE = 6.0D;
              private static final double HAND_FORWARD = 1.3D;
              private static final double THROW_SPEED = 2.0D;
              private static final float HIT_DAMAGE = 8.0F;
              private static final float IMPACT_DAMAGE = 6.0F;
              private static final float STRUGGLE_LIMIT = 100.0F;

              private static final double LAUNCH_SPEED = 0.85D;
              private static final int RISE_TICKS = 8;
              private static final int BARRAGE_TICKS = 24;
              private static final float AIR_HIT_DAMAGE = 2.0F;
              private static final float SLAM_DAMAGE = 6.0F;

              private static class Held {
                  final Entity entity;
                  final StandEntity stand;
                  float struggle = 0.0F;
                  Held(Entity entity, StandEntity stand) { this.entity = entity; this.stand = stand; }
              }

              private static class Thrown {
                  final Entity entity;
                  int ticks = 0;
                  Thrown(Entity entity) { this.entity = entity; }
              }

              private static class Barrage {
                  final LivingEntity target;
                  int ticks = 0;
                  Barrage(LivingEntity target) { this.target = target; }
              }

              private static final Map<UUID, Held> HELD = new HashMap<>();
              private static final Map<UUID, List<Thrown>> THROWN = new HashMap<>();
              private static final Map<UUID, List<Barrage>> BARRAGES = new HashMap<>();

              // ------------------------------------------------------------------ actions

              public static void grabOrThrow(PlayerEntity player, StandEntity stand) {
                  if (HELD.containsKey(player.getUUID())) {
                      throwHeld(player);
                  }
                  else {
                      tryGrab(player, stand);
                  }
              }

              public static void startAirBarrage(PlayerEntity player) {
                  LivingEntity target = findLivingTarget(player);
                  if (target == null) {
                      player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.nothing"), true);
                      return;
                  }
                  if (target instanceof MobEntity) {
                      ((MobEntity) target).setNoAi(true);
                  }
                  target.setDeltaMovement(0.0D, LAUNCH_SPEED, 0.0D);
                  target.hurtMarked = true;
                  BARRAGES.computeIfAbsent(player.getUUID(), id -> new ArrayList<>()).add(new Barrage(target));
              }

              private static LivingEntity findLivingTarget(PlayerEntity player) {
                  World world = player.level;
                  Vector3d from = player.getEyePosition(1.0F);
                  Vector3d look = player.getLookAngle();
                  Vector3d to = from.add(look.scale(RANGE));
                  LivingEntity best = null;
                  double bestDist = RANGE * RANGE;
                  AxisAlignedBB area = player.getBoundingBox().expandTowards(look.scale(RANGE)).inflate(1.0D);
                  List<Entity> candidates = world.getEntities(player, area,
                          e -> e instanceof LivingEntity && !(e instanceof PlayerEntity) && !(e instanceof StandEntity) && e.isAlive());
                  for (Entity e : candidates) {
                      Optional<Vector3d> hit = e.getBoundingBox().inflate(0.3D).clip(from, to);
                      if (hit.isPresent()) {
                          double dist = from.distanceToSqr(hit.get());
                          if (dist < bestDist) {
                              bestDist = dist;
                              best = (LivingEntity) e;
                          }
                      }
                  }
                  return best;
              }

              private static void tryGrab(PlayerEntity player, StandEntity stand) {
                  World world = player.level;

                  // 1) the nearest mob on the line of sight
                  LivingEntity best = findLivingTarget(player);
                  if (best != null) {
                      if (best instanceof MobEntity) {
                          ((MobEntity) best).setNoAi(true);
                      }
                      best.setNoGravity(true);
                      HELD.put(player.getUUID(), new Held(best, stand));
                      player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.grabbed"), true);
                      return;
                  }

                  // 2) otherwise a block
                  Vector3d from = player.getEyePosition(1.0F);
                  Vector3d to = from.add(player.getLookAngle().scale(RANGE));
                  BlockRayTraceResult ray = world.clip(new RayTraceContext(from, to,
                          RayTraceContext.BlockMode.OUTLINE, RayTraceContext.FluidMode.NONE, player));
                  if (ray.getType() == RayTraceResult.Type.BLOCK) {
                      BlockPos pos = ray.getBlockPos();
                      BlockState state = world.getBlockState(pos);
                      float hardness = state.getDestroySpeed(world, pos);
                      if (!state.isAir(world, pos) && hardness >= 0.0F && hardness <= 50.0F && !state.hasTileEntity()) {
                          // the falling block entity removes the original block on its first tick
                          FallingBlockEntity block = new FallingBlockEntity(world,
                                  pos.getX() + 0.5D, pos.getY(), pos.getZ() + 0.5D, state);
                          block.setNoGravity(true);
                          world.addFreshEntity(block);
                          HELD.put(player.getUUID(), new Held(block, stand));
                          player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.grabbed"), true);
                          return;
                      }
                  }
                  player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.nothing"), true);
              }

              private static void throwHeld(PlayerEntity player) {
                  Held held = HELD.remove(player.getUUID());
                  if (held == null) return;
                  Entity entity = held.entity;
                  if (!entity.isAlive()) return;
                  release(entity);
                  Vector3d look = player.getLookAngle();
                  entity.setDeltaMovement(look.x * THROW_SPEED, look.y * THROW_SPEED + 0.3D, look.z * THROW_SPEED);
                  entity.hurtMarked = true;
                  THROWN.computeIfAbsent(player.getUUID(), id -> new ArrayList<>()).add(new Thrown(entity));
              }

              private static void release(Entity entity) {
                  entity.setNoGravity(false);
                  entity.fallDistance = 0.0F;
                  if (entity instanceof MobEntity) {
                      ((MobEntity) entity).setNoAi(false);
                  }
              }

              // the point where the Stand's hand is: in front of the Stand, at chest height
              private static Vector3d handPos(PlayerEntity player, Held held) {
                  Vector3d look = player.getLookAngle();
                  Vector3d forward = new Vector3d(look.x, 0.0D, look.z).normalize();
                  if (held.stand != null && held.stand.isAlive()) {
                      return held.stand.position().add(forward.scale(HAND_FORWARD)).add(0.0D, held.stand.getBbHeight() * 0.65D, 0.0D);
                  }
                  return player.getEyePosition(1.0F).add(look.scale(2.5D));
              }

              // ------------------------------------------------------------------ events

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  PlayerEntity player = event.player;
                  if (player.level.isClientSide) return;
                  UUID id = player.getUUID();

                  tickHeld(player, id);
                  tickThrown(player, id);
                  tickBarrages(player, id);
              }

              private static void tickHeld(PlayerEntity player, UUID id) {
                  Held held = HELD.get(id);
                  if (held == null) return;
                  Entity e = held.entity;
                  boolean standGone = held.stand != null && !held.stand.isAlive();
                  if (!player.isAlive() || !e.isAlive() || e.level != player.level || standGone) {
                      HELD.remove(id);
                      if (e.isAlive()) release(e);
                      return;
                  }
                  // the victim struggles; stronger (more health) victims break free faster
                  if (e instanceof LivingEntity) {
                      held.struggle += 0.5F + ((LivingEntity) e).getMaxHealth() * 0.04F;
                      if (held.struggle >= STRUGGLE_LIMIT) {
                          HELD.remove(id);
                          release(e);
                          player.displayClientMessage(new TranslationTextComponent("rotp_twu.message.escaped"), true);
                          return;
                      }
                  }
                  Vector3d pos = handPos(player, held);
                  e.setPos(pos.x, pos.y - e.getBbHeight() / 2.0D, pos.z);
                  e.setDeltaMovement(Vector3d.ZERO);
                  e.fallDistance = 0.0F;
                  e.hurtMarked = true;
              }

              private static void tickThrown(PlayerEntity player, UUID id) {
                  List<Thrown> list = THROWN.get(id);
                  if (list == null) return;
                  Iterator<Thrown> it = list.iterator();
                  while (it.hasNext()) {
                      Thrown t = it.next();
                      Entity e = t.entity;
                      t.ticks++;
                      if (!e.isAlive() || t.ticks > 80) {
                          it.remove();
                          continue;
                      }
                      List<Entity> hits = player.level.getEntities(e, e.getBoundingBox().inflate(0.4D),
                              x -> x instanceof LivingEntity && x != player && !(x instanceof StandEntity) && x.isAlive());
                      boolean landed = t.ticks > 4 && (e.isOnGround() || e.horizontalCollision);
                      if (t.ticks > 2 && (!hits.isEmpty() || landed)) {
                          for (Entity victim : hits) {
                              victim.hurt(DamageSource.playerAttack(player), HIT_DAMAGE);
                          }
                          if (e instanceof LivingEntity) {
                              e.hurt(DamageSource.playerAttack(player), IMPACT_DAMAGE);
                          }
                          it.remove();
                      }
                  }
                  if (list.isEmpty()) THROWN.remove(id);
              }

              private static void tickBarrages(PlayerEntity player, UUID id) {
                  List<Barrage> list = BARRAGES.get(id);
                  if (list == null) return;
                  Iterator<Barrage> it = list.iterator();
                  while (it.hasNext()) {
                      Barrage b = it.next();
                      LivingEntity t = b.target;
                      b.ticks++;
                      if (!player.isAlive() || !t.isAlive()) {
                          endBarrage(t);
                          it.remove();
                          continue;
                      }
                      if (b.ticks < RISE_TICKS) continue;   // still flying up

                      int phase = b.ticks - RISE_TICKS;
                      if (phase < BARRAGE_TICKS) {
                          // hang in the air and take a flurry of punches
                          t.setNoGravity(true);
                          t.setDeltaMovement(Vector3d.ZERO);
                          t.fallDistance = 0.0F;
                          t.hurtMarked = true;
                          if (phase % 2 == 0) {
                              t.invulnerableTime = 0;
                              t.hurt(DamageSource.playerAttack(player), AIR_HIT_DAMAGE);
                              if (player.level instanceof ServerWorld) {
                                  ((ServerWorld) player.level).sendParticles(ParticleTypes.CRIT,
                                          t.getX(), t.getY() + t.getBbHeight() / 2.0D, t.getZ(), 6, 0.35D, 0.35D, 0.35D, 0.2D);
                              }
                              player.level.playSound(null, t.getX(), t.getY(), t.getZ(),
                                      SoundEvents.PLAYER_ATTACK_STRONG, SoundCategory.PLAYERS, 1.0F, 1.0F + (phase % 4) * 0.1F);
                          }
                      }
                      else {
                          // the finisher: slam the target down
                          endBarrage(t);
                          t.setDeltaMovement(0.0D, -1.6D, 0.0D);
                          t.hurtMarked = true;
                          t.invulnerableTime = 0;
                          t.hurt(DamageSource.playerAttack(player), SLAM_DAMAGE);
                          it.remove();
                      }
                  }
                  if (list.isEmpty()) BARRAGES.remove(id);
              }

              private static void endBarrage(LivingEntity target) {
                  target.setNoGravity(false);
                  if (target instanceof MobEntity) {
                      ((MobEntity) target).setNoAi(false);
                  }
              }

              @SubscribeEvent
              public static void onPlayerLogout(PlayerEvent.PlayerLoggedOutEvent event) {
                  UUID id = event.getPlayer().getUUID();
                  Held held = HELD.remove(id);
                  if (held != null && held.entity.isAlive()) release(held.entity);
                  List<Barrage> list = BARRAGES.remove(id);
                  if (list != null) {
                      for (Barrage b : list) {
                          if (b.target.isAlive()) endBarrage(b.target);
                      }
                  }
                  THROWN.remove(id);
              }
          }
          EOF

